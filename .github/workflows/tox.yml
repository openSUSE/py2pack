# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit tests

on: [push, pull_request]

jobs:
    test:

        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install tox
              run: python -m pip install --upgrade pip tox tox-gh-actions
            - name: Run the test suite
              run: python -mtox --parallel auto --parallel-live -- -vvvvv

    fedora:
        runs-on: ubuntu-latest
        container: registry.fedoraproject.org/fedora:latest
        steps:
            - name: Install RPM build tools
              run: >-
                  dnf -y install git gcc rpm-build pyproject-rpm-macros
                  python3-devel python3-pip python3-setuptools python3-wheel
                  python3-pytest
            - uses: actions/checkout@v4
            - name: Install py2pack and test dependencies
              run: python3 -m pip install . -r test-requirements.txt
            - name: Build generated Fedora RPMs
              env:
                  PY2PACK_TEST_FEDORA_BUILDS: "1"
              run: >-
                  python3 -m pytest -v test/test_fedora_build.py
                  --basetemp=/tmp/fedora-build-tests
            - name: Upload RPM build logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: fedora-rpm-build-logs
                  path: /tmp/fedora-build-tests/**/build.log

    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install tox
              run: python -m pip install --upgrade pip tox
            - name: Lint
              run: tox -e pep8

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install tox
              run: python -m pip install --upgrade pip tox
            - name: Check code coverage
              run: tox -e cover
